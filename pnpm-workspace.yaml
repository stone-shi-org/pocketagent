packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 12 (via pnpm 11) replaced onlyBuiltDependencies/neverBuiltDependencies/
# ignoredBuiltDependencies with one allowBuilds map. These three are still the
# native modules this repo depends on compiling from source on install (see
# README's "compiles node-pty and better-sqlite3 from source" note).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  node-pty: true

patchedDependencies:
  better-sqlite3@11.10.0: patches/better-sqlite3@11.10.0.patch
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
