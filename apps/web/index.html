<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover + interactive-widget=resizes-content makes the mobile
      keyboard shrink the layout instead of scrolling it out from under itself.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Both of these were left on the old dark palette; a mismatch here shows
         as a dark flash and dark form controls before the stylesheet lands. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- SVG first for anything modern; the .ico is the fallback, and is a real
         image because the SPA catch-all otherwise answers /favicon.ico with
         index.html at 200, which browsers quietly render as no icon at all. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The terminal's bundled Nerd Font (styles.css's @font-face block) is
         on the critical path for the first terminal a session opens; only
         the regular weight is preloaded; bold/italic are rarer and load
         lazily on first use instead. -->
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-nerd-font-mono-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>PocketAgent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
